<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎来到空白地</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}
/* 全屏欢迎背景 */
#welcome-page {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #132f4c 0%, #0a1929 48%, #05101d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
}
/* 呼吸光圈 */
.blank-ring {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 1px solid rgba(215, 234, 255, 0.35);
    opacity: 0;
    transform: scale(0.5);
    animation: ringBreath 3.5s ease forwards;
}
/* 浮动微光背景 */
.space-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(215, 234, 255, 0.08) 0%, transparent 60%);
    animation: bgPulse 4s ease-in-out infinite;
}
/* 主文字 */
.welcome-text {
    font-size: 26px;
    color: #d7eaff;
    letter-spacing: 10px;
    opacity: 0;
    transform: scale(1.15);
    animation: welcomeFadeIn 3.2s ease forwards;
    z-index: 2;
}
/* 点击提示文字 */
.tip-text {
    font-size: 14px;
    color: rgba(215, 234, 255, 0.6);
    letter-spacing: 3px;
    opacity: 0;
    animation: welcomeFadeIn 4s ease forwards;
    z-index: 2;
    cursor: pointer;
}
.tip-text:hover {
    color: #fff;
    text-shadow: 0 0 10px #d7eaff;
}

@keyframes welcomeFadeIn {
    0% {opacity:0; transform:scale(1.15);}
    100% {opacity:1; transform:scale(1);}
}
@keyframes ringBreath {
    0% {opacity:0; transform:scale(0.5);}
    50% {opacity:0.7;}
    100% {opacity:0.35; transform:scale(1);}
}
@keyframes bgPulse {
    0%,100% {opacity:0;}
    50% {opacity:1;}
}
</style>
</head>
<body>
<div id="welcome-page">
    <div class="space-bg"></div>
    <div class="blank-ring"></div>
    <div class="welcome-text">欢迎来到空白地</div>
    <div class="tip-text" onclick="jumpHome()">点击进入</div>
</div>

<script>
// 点击跳转主页home.html
function jumpHome(){
    window.location.href = "home.html";
}
</script>
</body>
</html>
